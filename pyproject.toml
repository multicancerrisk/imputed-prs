[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imputed-prs"
version = "0.1.0"
description = "Calculate Polygenic Risk Scores via linear imputation of missing variants"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "pyarrow>=8.0.0",
    "h5py>=3.0.0",
    "requests>=2.25.0",
    "snps>=2.0.0",
    "joblib>=1.0.0",
    "threadpoolctl>=3.0",
    "cyvcf2>=0.30.0",
    "pandas-plink>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "jsonschema>=4.0.0",
]
optuna = [
    "optuna>=3.0.0",
]
plotting = [
    "matplotlib>=3.5.0",
]
bench = [
    "pyliftover>=0.4",
]
scale = [
    # PLINK 2 PGEN streaming reader (io/genotype_source.py::PgenGenotypeSource).
    # Lazily imported; the CPU/VCF path works without it.
    "pgenlib>=0.94",
]
gpu = [
    # GPU compute backend (compute/gpu_backend.py) for Apple MPS / NVIDIA CUDA.
    # Lazily imported; the CPU path is fully functional without it. On Python 3.14
    # pip resolves the cp314 arm64/CUDA wheel (torch >= 2.9 ship cp314 wheels).
    "torch>=2.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (may require network access)",
    "slow: marks tests that are slow or memory-heavy (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring the optional torch/GPU backend (skipped without torch)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["imputed_prs*"]

[tool.setuptools.package-data]
imputed_prs = [
    "data/platforms/*.json",
    "data/platforms/*.txt.gz",
]
